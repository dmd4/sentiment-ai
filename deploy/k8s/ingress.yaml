apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sentiment-ai-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: sentiment-ai.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sentiment-ai-service
            port:
              number: 80
