apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentiment-ai-deployment
  labels:
    app: sentiment-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sentiment-ai
  template:
    metadata:
      labels:
        app: sentiment-ai
    spec:
      containers:
      - name: sentiment-ai
        image: sentiment-ai:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: sentiment-ai-config
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
