apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: sentiment-analysis-api
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/memory: "1Gi"
        run.googleapis.com/cpu: "1000m"
    spec:
      containerConcurrency: 100
      containers:
      - image: gcr.io/YOUR_PROJECT/sentiment-analysis:latest
        ports:
        - containerPort: 8000
        env:
        - name: MODEL_PATH
          value: "/app/models/sentiment_analysis_model_v2.h5"
        - name: TOKENIZER_PATH
          value: "/app/models/tokenizer_v2.pickle"
        - name: MAX_SEQUENCE_LENGTH
          value: "22"
        resources:
          limits:
            cpu: "1000m"
            memory: "1Gi"
