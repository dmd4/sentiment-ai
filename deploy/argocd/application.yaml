apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sentiment-ai
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/yourusername/sentiment-ai.git'
    targetRevision: HEAD
    path: deploy/helm/sentiment-ai
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
