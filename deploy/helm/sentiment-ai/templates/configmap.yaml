apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sentiment-ai.fullname" . }}-config
  labels:
    {{- include "sentiment-ai.labels" . | nindent 4 }}
data:
  MODEL_PATH: {{ .Values.env.MODEL_PATH | quote }}
  TOKENIZER_PATH: {{ .Values.env.TOKENIZER_PATH | quote }}
  MAX_SEQUENCE_LENGTH: {{ .Values.env.MAX_SEQUENCE_LENGTH | quote }}
